name: Build Multi-Platform Executables

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as a GitHub Release (e.g. for testing without a git tag)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: cgsusa_manual_downloader-windows
            binary_src: dist/cgsusa_manual_downloader.exe
            target_binary: cgsusa_manual_downloader-windows.exe

          - os: macos-latest
            artifact_name: cgsusa_manual_downloader-macos
            binary_src: dist/cgsusa_manual_downloader
            target_binary: cgsusa_manual_downloader-macos

          - os: ubuntu-latest
            artifact_name: cgsusa_manual_downloader-linux
            binary_src: dist/cgsusa_manual_downloader
            target_binary: cgsusa_manual_downloader-linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build standalone executable with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --name "cgsusa_manual_downloader" download_manuals.py

      - name: Prepare binary for upload
        shell: bash
        run: |
          if [ -f "${{ matrix.binary_src }}" ]; then
            chmod +x "${{ matrix.binary_src }}" || true
            cp "${{ matrix.binary_src }}" "./${{ matrix.target_binary }}"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ./${{ matrix.target_binary }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Display downloaded assets
        run: ls -la release-assets

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
